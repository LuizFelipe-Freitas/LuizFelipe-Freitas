# Gera a animação da cobrinha a partir do gráfico de contribuições, uma vez por dia
name: Cobrinha das contribuições

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#6A1B9A&color_dots=#ebedf0,#d1b3e6,#a970d1,#8A2BE2,#4B0082
            dist/snake-dark.svg?palette=github-dark&color_snake=#B388FF&color_dots=#161b22,#3b1f5c,#5e2b97,#8A2BE2,#B388FF

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
